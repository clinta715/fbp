[package]
name = "fbp"
version.workspace = true
edition.workspace = true
description = "A bitmap-projected TUI library player. P0: the audio path."

[[bin]]
name = "fbp"
path = "src/main.rs"

[features]
default = ["device"]
# Audio output. Off with --no-default-features: the CLI still lists and decodes.
device = ["fbp-audio/device"]

[dependencies]
fbp-core = { path = "../fbp-core" }
fbp-audio = { path = "../fbp-audio", default-features = false }
# Only its crossterm re-export so far; the cell grid itself is P1.
ratatui = "0.30"
walkdir = "2"
