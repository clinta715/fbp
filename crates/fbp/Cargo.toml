[package]
name = "fbp"
version.workspace = true
edition.workspace = true
description = "A bitmap-projected TUI library player."

[[bin]]
name = "fbp"
path = "src/main.rs"

[features]
default = ["device"]
# Audio output. Off with --no-default-features: the UI, the index and the shots still run.
device = ["fbp-audio/device"]
# Headless frame capture (--shots): an 8x8 bitmap font and a PNG encoder. Off by default so
# the shipped path carries neither.
shots = ["dep:font8x8", "dep:png"]

[dependencies]
fbp-core = { path = "../fbp-core" }
fbp-audio = { path = "../fbp-audio", default-features = false }
fbp-index = { path = "../fbp-index" }
ratatui = "0.30"
walkdir = "2"
dirs = "5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
font8x8 = { version = "0.3", optional = true }
png = { version = "0.17", optional = true }

[dev-dependencies]
# The UI tests assert on the file, not on the index: the write is the thing being tested.
lofty = "0.25"
